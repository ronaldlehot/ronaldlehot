name: Generate contribution Pac-Man

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.repository.name == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      # The action reports scores to a third-party leaderboard; block it.
      - name: Block third-party stats endpoint
        run: echo "0.0.0.0 elec.abozanona.me" | sudo tee -a /etc/hosts

      - name: Generate Pac-Man from contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
